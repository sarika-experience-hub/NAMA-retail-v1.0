<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loan Details — Azentio Finance</title>
<link rel="stylesheet" href="css/styles.css?v=1788177009403">
</head>
<body>
<div class="device">
  <div class="screen">
<div class="notch"></div><div class="statusbar"><span>9:41</span><div class="icons">
  <svg class="icon-signal" viewBox="0 0 18 12" width="18" height="12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx=".5"/><rect x="5" y="5" width="3" height="7" rx=".5"/><rect x="10" y="3" width="3" height="9" rx=".5"/><rect x="15" y="0" width="3" height="12" rx=".5"/></svg>
  <svg class="icon-battery" viewBox="0 0 25 12" width="22" height="11" fill="none"><rect x="0.5" y="0.5" width="20" height="11" rx="2.5" stroke="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1" fill="currentColor"/><rect x="21.5" y="4" width="2" height="4" rx="1" fill="currentColor"/></svg>
</div></div>
  <div class="page ">
    <div class="app-header"><a class="icon-btn" href="apply-disclaimer.html" onclick="return true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg></a><div class="title">Loan Details</div></div>
    <div class="body">
<div class="stepper-wrap-ring">
    <div class="ring-progress" style="--pct:20.0;"><span class="ring-label">1/5</span></div>
    <div class="step-label"><span>Step <b>1</b> of 5</span><span>Loan details</span></div>
  </div>
    <div class="h2">Loan details</div>
    <div class="p">Tell us how much you need and where the funds should go.</div>
    <div class="field">
    <label>Requested loan amount <span class="req">*</span></label>
    <div class="sar-input-row">
      <span class="sar-prefix"><span class="code">SAR</span></span>
      <div class="divider"></div>
      <input class="input sar-number-input" type="number" inputmode="decimal" placeholder="0.00" value="20000">
    </div>
  </div>
    <div class="range-minmax"><span>Min SAR 10,000</span><span>Max SAR 300,000</span></div>
    <div class="field select-field"><select class="input"><option>12 months</option><option>24 months</option><option>36 months</option><option>48 months</option></select><label>Tenure in months <span class="req">*</span></label></div>
    <div class="field"><input class="input" type="text" placeholder="SA00 0000 0000 0000 0000 0000" data-mask="iban" data-validate="iban"><label>IBAN</label><div class="error-msg"></div></div>
    <div class="field"><input class="input" type="text" placeholder="e.g. Al Rajhi Bank" ><label>Bank name</label><div class="error-msg"></div></div>
    <div class="upload-row" data-upload="IBAN_certificate.pdf &middot; 240 KB">
      <div class="u-ico"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V7"/><path d="M8 11l4-4 4 4"/><rect x="3.5" y="3.5" width="17" height="17" rx="3"/></svg></div>
      <div class="u-txt"><div class="u-name">IBAN certificate</div><div class="u-sub">PDF or image, up to 5 MB</div></div>
      <div class="u-act">Upload</div>
    </div>
    <div class="hint">Amount and tenure values are indicative, pending confirmation of the card product (Q-17).</div>
    </div>
    <div class="footer"><a class="btn btn-primary" href="apply-personal-details.html" data-nav><span class="label">Next</span><span class="spinner"></span></a></div>

  </div>
  <div class="home-indicator"></div>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
